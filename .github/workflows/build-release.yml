name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.framework }} (win-x64)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net6.0-windows
          - net8.0-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Restore
        run: dotnet restore TVisionUpperDemp.csproj
      - name: Build
        run: dotnet build TVisionUpperDemp.csproj --configuration Release --no-restore -p:TargetFramework=${{ matrix.framework }}
      - name: Publish and package
        shell: pwsh
        run: |
          $version = "${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name || format('0.1.0-dev.{0}', github.run_number) }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          ./scripts/publish.ps1 -Framework "${{ matrix.framework }}" -Version $version
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.framework }}-win-x64
          path: artifacts/TVisionUpperDemp-${{ matrix.framework }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TVisionUpperDemp ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
