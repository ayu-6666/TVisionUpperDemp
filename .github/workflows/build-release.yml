name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - 'RELEASE-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.framework }} (win-x64)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net6.0-windows
          - net8.0-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Restore
        run: dotnet restore TVisionUpperDemp.csproj
      - name: Build
        run: dotnet build TVisionUpperDemp.csproj --configuration Release --no-restore -p:TargetFramework=${{ matrix.framework }}
      - name: Publish and package
        shell: pwsh
        run: |
          $version = "${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-dev.{0}', github.run_number) }}"
          $version = $version -replace '^(?i:RELEASE-)', ''
          $version = $version -replace '^[vV]', ''
          ./scripts/publish.ps1 -Framework "${{ matrix.framework }}" -Version $version
          $publishDir = Join-Path $PWD "artifacts/publish/${{ matrix.framework }}-win-x64"
          $outputDir = Join-Path $PWD "artifacts"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DMyFramework=${{ matrix.framework }}" "/DPublishDir=$publishDir" "/DOutputDir=$outputDir" "installer/TVisionUpperDemp.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.framework }}-win-x64
          path: artifacts/TVisionUpperDemp-${{ matrix.framework }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.framework }}-win-x64
          path: artifacts/TVisionUpperDemp-Setup-${{ matrix.framework }}-win-x64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/RELEASE-')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-win-x64'
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip *.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TVisionUpperDemp ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
